server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: cce-emitter-adaptor

# Mediator Identity & Endpoint
mediator:
  urn: "urn:mediator:cce-emitter-adaptor"
  version: "1.0.0"
  name: "CCE Emitter Adaptor"
  endpoint:
    host: localhost
    path: /inbound
    type: http

# OpenHIM Core Configuration
openhim:
  core:
    host: localhost
    api-port: 8080
    scheme: https
    auth-type: basic
    username: root@openhim.org
    password: 123456
  heartbeat:
    enabled: true
    interval-seconds: 10

# CCE Collector Configuration
cce:
  collector:
    url: http://localhost:5001
    events-path: /v1/events
    timeout: 5000
    retry:
      max-attempts: 3
      backoff-ms: 1000
    auth:
      token: local-dev-token
      keycloak-host:
      realm:
      client-id:
      client-secret:
  emitter:
    patient-identifier-system: "http://openphc.org/identifier/upid"
    facility-filter:
      ids: []
    sources:
      ebuzima:
        client-id: ebuzima-emr-client
      spice:
        client-id: spice-fhir-client
      openmrs:
        client-id: openmrs-fhir-client
      spice-facility:
        client-id: spice-facility-client

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: cce-emitter-adaptor

# Logging
logging:
  level:
    org.openphc.cce: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
